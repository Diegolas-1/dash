name: iOS companion (unsigned .ipa)

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
    tags: ['ios-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project DashRemote.xcodeproj -scheme DashRemote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*\.swift|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: Package .ipa
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DashRemote.app Payload/
          zip -qr DashRemote-unsigned.ipa Payload
          ls -la DashRemote-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DashRemote-unsigned-ipa
          path: ios/DashRemote-unsigned.ipa
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build.log
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ios/DashRemote-unsigned.ipa --title "Dash Remote ${GITHUB_REF_NAME}" --generate-notes

  screenshots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project DashRemote.xcodeproj -scheme DashRemote -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee simbuild.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" simbuild.log
      - name: Capture each tab
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'] in ('iPhone 15','iPhone 15 Pro','iPhone 14')]; print(c[0]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/DashRemote.app
          mkdir -p shots
          for tab in remote keyboard setup settings dash; do
            xcrun simctl launch "$UDID" local.dash.remote -demo -tab "$tab"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$tab.png"
            xcrun simctl terminate "$UDID" local.dash.remote || true
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: ios/shots/*.png
