<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Dash Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg">
    <div class="layer" id="bgA"></div>
    <div class="layer" id="bgB"></div>
  </div>
  <div id="shade"></div>

  <div id="ui">
    <header>
      <div id="clockBox">
        <div id="time">--:--</div>
        <div id="date"></div>
      </div>
      <div id="weather" hidden>
        <div id="wTemp"></div>
        <div id="wDesc"></div>
        <div id="wRange"></div>
      </div>
    </header>

    <aside id="prayers" hidden></aside>

    <footer>
      <div class="rowLabel">Apps</div>
      <div class="dock" id="appRow"></div>
      <div class="rowLabel" id="ytLabel">YouTube</div>
      <div class="dock" id="ytRow"></div>
      <div id="hint"></div>
    </footer>
  </div>

  <div id="dim"></div>
  <div id="toast" hidden></div>

  <script src="js/host.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
