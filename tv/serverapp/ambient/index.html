<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Ambient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="config.js"></script>
  <script>
    (function () {
      var m = /[?&]theme=([a-z]+)/.exec(location.search);
      var theme = (m && m[1]) || (window.AMBIENT_CONFIG && window.AMBIENT_CONFIG.theme) || 'ink';
      if (['ink', 'poster', 'parks'].indexOf(theme) < 0) theme = 'ink';
      document.write('<link rel="stylesheet" href="theme-' + theme + '.css">');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body data-mode="day">
  <svg width="0" height="0" class="defs" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.3 8.3 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10.2a3.8 3.8 0 0 0 .6-7.6 5.6 5.6 0 0 0-10.8-1.4A4.5 4.5 0 0 0 7 18.5z"/></symbol>
      <symbol id="i-cloud-sun" viewBox="0 0 24 24"><path d="M9 19h8.4a3.3 3.3 0 0 0 .5-6.6 4.9 4.9 0 0 0-9.4-1.2A3.9 3.9 0 0 0 9 19z"/><path d="M6 10.4a3.6 3.6 0 0 1 5.9-3.1M8.4 3.2v1.6M3.2 8.4h1.6M4.7 4.7l1.1 1.1"/></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15.5h10.2a3.6 3.6 0 0 0 .6-7.2 5.4 5.4 0 0 0-10.4-1.3A4.3 4.3 0 0 0 7 15.5z"/><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5"/></symbol>
      <symbol id="i-snow" viewBox="0 0 24 24"><path d="M7 14.5h10.2a3.6 3.6 0 0 0 .6-7.2 5.4 5.4 0 0 0-10.4-1.3A4.3 4.3 0 0 0 7 14.5z"/><path d="M9 18v3M7.7 18.8l2.6 1.4M7.7 20.2l2.6-1.4M15 18v3M13.7 18.8l2.6 1.4M13.7 20.2l2.6-1.4"/></symbol>
      <symbol id="i-fog" viewBox="0 0 24 24"><path d="M4 10h16M6 14h12M8 18h8"/></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><path d="M7 14.5h10.2a3.6 3.6 0 0 0 .6-7.2 5.4 5.4 0 0 0-10.4-1.3A4.3 4.3 0 0 0 7 14.5z"/><path d="M12.5 15l-2.2 3.6h3.2L11.6 22"/></symbol>
      <!-- smart-object icon library (pick per light in config.js) -->
      <symbol id="l-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1.1 2.2h5c.1-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="l-lamp" viewBox="0 0 24 24"><path d="M8 3h8l3 8H5l3-8zM12 11v8M8 21h8"/></symbol>
      <symbol id="l-floor-lamp" viewBox="0 0 24 24"><path d="M9 2h6l2 6H7l2-6zM12 8v13M8 21h8"/></symbol>
      <symbol id="l-strip" viewBox="0 0 24 24"><path d="M3 8c3 0 3 4 6 4s3-4 6-4 3 4 6 4"/><path d="M3 16c3 0 3 4 6 4s3-4 6-4 3 4 6 4" opacity=".5"/><circle cx="6" cy="9.5" r=".8"/><circle cx="12" cy="10.5" r=".8"/><circle cx="18" cy="9.5" r=".8"/></symbol>
      <symbol id="l-ceiling" viewBox="0 0 24 24"><path d="M12 2v5M5 14h14a7 7 0 0 0-14 0zM9 18l-1 3M15 18l1 3M12 18v3"/></symbol>
      <symbol id="l-spot" viewBox="0 0 24 24"><path d="M12 3l-4 7h8l-4-7zM12 10v3M7 21l5-8 5 8"/></symbol>
      <symbol id="l-desk" viewBox="0 0 24 24"><path d="M4 20h16M7 20V10l5-6 3 3-5 6M15 7l3-2"/></symbol>
      <symbol id="l-bed" viewBox="0 0 24 24"><path d="M3 18v-6h18v6M3 12V7h8v5M5 18v2M19 18v2M14 9h5a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="l-couch" viewBox="0 0 24 24"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M3 13a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4H3v-4zM5 17v2M19 17v2"/></symbol>
      <symbol id="l-kitchen" viewBox="0 0 24 24"><path d="M4 10h16M6 10v10h12V10M9 14h6M10 4v6M14 4v6M7 4h10"/></symbol>
      <symbol id="l-tv" viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/><path d="M1 8v5M23 8v5" opacity=".5"/></symbol>
      <symbol id="l-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4"/></symbol>
      <symbol id="l-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 2-6 4-6s3 3 0 5l-4 1zM14 12c4 0 6 2 6 4s-3 3-5 0l-1-4zM12 14c0 4-2 6-4 6s-3-3 0-5l4-1zM10 12c-4 0-6-2-6-4s3-3 5 0l1 4z"/></symbol>
      <symbol id="l-candle" viewBox="0 0 24 24"><path d="M12 2c-1.5 2-2 3-2 4a2 2 0 0 0 4 0c0-1-.5-2-2-4zM9 9h6v12H9zM12 12v3"/></symbol>
      <symbol id="l-string" viewBox="0 0 24 24"><path d="M2 6c4 4 6 4 10 4s6 0 10-4"/><path d="M6 9v3M12 10v3M18 9v3"/><path d="M6 12a1.5 2 0 0 0 0 4a1.5 2 0 0 0 0-4M12 13a1.5 2 0 0 0 0 4a1.5 2 0 0 0 0-4M18 12a1.5 2 0 0 0 0 4a1.5 2 0 0 0 0-4"/></symbol>
      <symbol id="l-door" viewBox="0 0 24 24"><path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h1"/></symbol>
      <symbol id="l-bath" viewBox="0 0 24 24"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-3zM6 12V6a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2"/></symbol>
      <symbol id="l-plant" viewBox="0 0 24 24"><path d="M12 21v-8M12 13c-4 0-6-3-6-6 3 0 6 2 6 6zM12 13c4 0 6-3 6-6-3 0-6 2-6 6zM8 21h8"/></symbol>
    </defs>
  </svg>

  <div id="backdrop">
    <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
    <div class="photo" id="photoA"></div>
    <div class="photo" id="photoB"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <main id="stage">
    <section class="clockBlock">
      <div class="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span id="ampm"></span></div>
      <div class="dateline"><span id="dow"></span><i class="sep"></i><span id="date"></span><span id="greeting"></span></div>
    </section>

    <section class="artCaption" id="artCaption">
      <div class="artPark" id="artPark"></div>
      <div class="artSub"><span id="artKind">National Park</span><i class="sep"></i><span id="artState"></span></div>
    </section>

    <section class="photoFrame" id="photoFrame">
      <div class="pf" id="pfA"></div>
      <div class="pf" id="pfB"></div>
      <div class="pfEmpty" id="pfEmpty"><div class="disc"></div><div class="pfText" id="pfText"></div></div>
    </section>

    <section class="weather" id="weather">
      <div class="wNow">
        <svg class="wIcon"><use id="wIconUse" href="#i-sun"/></svg>
        <div class="wTemp"><span id="wTemp">--</span><span class="deg">°</span></div>
        <div class="wText">
          <div class="wDesc" id="wDesc">Fetching the forecast…</div>
          <div class="wSub" id="wSub"></div>
        </div>
      </div>
      <svg id="wCurve" viewBox="0 0 1040 230" preserveAspectRatio="none"></svg>
      <div class="wDays" id="wDays"></div>
    </section>

    <aside class="column">
      <article class="panel media" id="pMedia" hidden>
        <div class="eyebrow" id="mediaEyebrow">Now playing</div>
        <div class="mediaRow">
          <div class="poster" id="mediaPoster"></div>
          <div class="mediaText">
            <div class="mediaTitle" id="mediaTitle"></div>
            <div class="mediaSub" id="mediaSub"></div>
            <div class="track"><i id="mediaBar"></i></div>
          </div>
        </div>
      </article>

      <article class="panel rotate" id="pRotate" hidden>
        <div class="eyebrow" id="rotEyebrow"></div>
        <div class="rotBody" id="rotBody"></div>
      </article>

      <article class="panel lights" id="pLights" hidden>
        <div class="eyebrow"><span>Lights</span><span class="lightsHint" id="lightsHint"></span></div>
        <div class="bay" id="lightBay"></div>
      </article>
    </aside>

    <footer class="statusline" id="statusline"></footer>
  </main>

  <div id="sleepClock" hidden><span id="sleepTime"></span><span id="sleepDate"></span></div>
  <div id="demoTag" hidden>preview data</div>

  <script src="art/parks/manifest.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
